# NAAMI — Nginx reverse proxy for the OVH VPS.
# Copy to /etc/nginx/sites-available/naami, symlink into sites-enabled,
# replace naami.example.com with your domain, then run:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d naami.example.com -d www.naami.example.com
# Certbot rewrites this file to add the :443 TLS block and an HTTP->HTTPS redirect.

upstream naami_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name naami.example.com www.naami.example.com;

    # Uploads / request body cap (admin video uploads allow up to 60MB —
    # see src/lib/videoProcessing.ts MAX_VIDEO_UPLOAD_BYTES — leave headroom above it)
    client_max_body_size 65M;

    # gzip (Next also sets compress:true, this covers proxied responses)
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Force HTTPS for a year on every subdomain. Only meaningful once certbot has
    # added the :443 block below — do not enable it before TLS works, since a
    # browser that sees it will refuse to fall back to http for max-age.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Nothing in this app uses these device APIs; deny them outright so an
    # injected script or a third-party frame cannot ask for them.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # CSP in REPORT-ONLY first. Nothing is blocked; violations are reported to the
    # browser console so you can watch a few real checkouts before enforcing.
    # To enforce, rename the header to Content-Security-Policy — but only after
    # a full test purchase produces zero violations, or the Razorpay widget will
    # break silently and payments will stop.
    #
    # Origins allowed, and why:
    #   checkout.razorpay.com   the checkout widget script and its iframe
    #   api.razorpay.com        the widget posts to it and frames it for 3-D Secure
    #   lumberjack.razorpay.com Razorpay telemetry beacons (blocked = noisy console)
    #   *.razorpay.com          bank/PSP redirects during 3-D Secure land on subdomains
    #   connect.facebook.net    Meta Pixel loader (src/components/MetaPixel.tsx)
    #   www.facebook.com        the Pixel <noscript> tracking image
    # 'unsafe-inline' is required for scripts because Next.js inlines its hydration
    # payload, and for styles because this codebase styles heavily via style={{}}.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.facebook.com https://*.razorpay.com; font-src 'self' data:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://*.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://*.razorpay.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Long-cache immutable build assets (hashed filenames)
    location /_next/static/ {
        proxy_pass http://naami_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # nginx DISCARDS every inherited add_header in a block that declares one of
        # its own, so the server-level security headers above must be repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Razorpay server-to-server webhook. Deliberately unauthenticated: it carries
    # no session and is authenticated by an HMAC over the RAW request body. Do not
    # add auth_basic, a rate limit, or any module that buffers/rewrites the body
    # here — altering a single byte invalidates the signature and every payment
    # notification starts failing. Razorpay retries, so slow responses are fine.
    location /api/webhooks/ {
        proxy_pass http://naami_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://naami_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
